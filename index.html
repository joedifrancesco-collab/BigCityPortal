<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Big City Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Big City Portal</h1>
    <div id="clock"></div>
    <button id="settings-export" title="Download your settings as a file">Export</button>
    <button id="settings-import" title="Load settings from a file">Import</button>
    <input id="settings-file" type="file" accept=".json,application/json" hidden>
    <button id="theme-toggle" title="Toggle theme">◐</button>
  </header>
  <main>
    <form id="search" autocomplete="off">
      <select id="engine"></select>
      <input id="q" type="search" placeholder="Search…" autofocus>
      <button type="submit">Search</button>
    </form>
    <section id="quicklaunch"></section>
    <div id="widgets"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
